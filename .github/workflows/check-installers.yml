name: Check CLI installers

on:
  push:
    branches:
      - main
    paths:
      - "utils/installers/**"
      - ".github/workflows/check-installers.yml"
  pull_request:
    paths:
      - "utils/installers/**"
      - ".github/workflows/check-installers.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run installer
        shell: bash
        run: |
          set -euo pipefail

          HF_TEST_ROOT=$(mktemp -d)
          INSTALL_DIR="$HF_TEST_ROOT/install"
          BIN_DIR="$HF_TEST_ROOT/bin"

          # Skills are installed under `~`: point HOME at the test root to keep the run hermetic.
          export HOME="$HF_TEST_ROOT"

          HF_HOME="$INSTALL_DIR" HF_CLI_BIN_DIR="$BIN_DIR" utils/installers/install.sh --no-modify-path

          export PATH="$BIN_DIR:$PATH"

          if ! hf version | tee /dev/stderr | grep -Eq '[0-9]+(\.[0-9]+){1,2}(\.[a-zA-Z]+[0-9]+)?'; then
            echo "incorrect hf version output" >&2
            exit 1
          fi

          # The hf-cli skill is installed by default, generated by the installed version
          SKILL_MD="$HOME/.agents/skills/hf-cli/SKILL.md"
          if [ ! -f "$SKILL_MD" ]; then
            echo "hf-cli skill not installed at $SKILL_MD" >&2
            exit 1
          fi
          HF_VERSION=$(hf version --format quiet)
          if ! grep -q "huggingface_hub v$HF_VERSION" "$SKILL_MD"; then
            echo "hf-cli skill not aligned with hf version $HF_VERSION" >&2
            exit 1
          fi

          NO_COLOR=1 hf --help

          rm -rf "$HF_TEST_ROOT"

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run installer
        shell: pwsh
        run: |
          $hfTestRoot = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString())
          $installDir = Join-Path $hfTestRoot 'install'
          $binDir = Join-Path $hfTestRoot 'bin'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null

          $env:HF_HOME = $installDir
          $env:HF_CLI_BIN_DIR = $binDir
          # Skills are installed under the user profile: point it at the test root to keep the run hermetic.
          $env:USERPROFILE = $hfTestRoot
          & "$PWD/utils/installers/install.ps1" -NoModifyPath

          $env:PATH = "$binDir;$env:PATH"

          $hfVersionOutput = & hf.exe version 2>&1
          $hfVersionOutput | Out-Host  # Show the output

          if ($LASTEXITCODE -ne 0) {
              throw 'hf version failed'
          }

          if (-not ($hfVersionOutput -match '[0-9]+(\.[0-9]+){1,2}(\.[a-zA-Z]+[0-9]+)?')) {
              throw 'incorrect hf version output'
          }

          # The hf-cli skill is installed by default, generated by the installed version
          $skillMd = Join-Path $hfTestRoot '.agents\skills\hf-cli\SKILL.md'
          if (-not (Test-Path $skillMd)) {
              throw "hf-cli skill not installed at $skillMd"
          }
          $hfVersion = (& hf.exe version --format quiet).Trim()
          if (-not (Select-String -Path $skillMd -SimpleMatch "huggingface_hub v$hfVersion" -Quiet)) {
              throw "hf-cli skill not aligned with hf version $hfVersion"
          }

          $env:NO_COLOR = '1'
          & hf.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw 'hf --help failed'
          }
          Remove-Item Env:NO_COLOR

          Remove-Item -Path $hfTestRoot -Recurse -Force
