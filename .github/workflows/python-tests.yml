name: Python tests

on:
  push:
    branches:
      - main
      - ci_*
    paths-ignore:
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"

# Cancel superseded runs: a new push to a PR makes the previous run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-imports:
    permissions:
      contents: read
    # Catch missing dependencies: install only base requirements and verify all public imports work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install base dependencies only
        run: |
          pip install --upgrade uv
          uv venv
          uv pip install .
      - name: Check imports
        run: |
          source .venv/bin/activate
          python utils/check_imports.py

  build-ubuntu:
    permissions:
      contents: read
    runs-on:
      group: aws-general-8-plus
    # A healthy full-suite job takes ~20min. Anything much longer means something is stuck: fail fast instead of
    # burning a runner until GitHub's 6h limit.
    timeout-minutes: 45
    env:
      UV_HTTP_TIMEOUT: 600 # max 10min to install deps

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        # Test suites are defined in tests/conftest.py (`pytest_collection_modifyitems`).
        test_name: ["api", "transfer (hf_xet)", "transfer (no hf_xet)", "inference"]
        include:
          - python-version: "3.10" # test torch~=1.11 on python 3.10 only.
            test_name: "Python 3.10, torch_1.11"
          - python-version: "3.12" # test torch latest on python 3.12 only.
            test_name: "torch_latest"
          - python-version: "3.13" # gradio not supported on 3.14 -> test it on 3.13
            test_name: "gradio"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Setup venv
      # TODO: revisit when https://github.com/astral-sh/uv/issues/1526 is addressed.
      - name: Setup venv + uv
        run: |
          pip install --upgrade uv
          uv venv

      # Install dependencies
      - name: Install dependencies
        run: |
          uv pip install "huggingface_hub[testing] @ ."

          case "${{ matrix.test_name }}" in

            inference)
              sudo apt update
              sudo apt install -y libsndfile1-dev
              ;;

            gradio)
              uv pip install "huggingface_hub[gradio] @ ."
            ;;

            torch_latest)
              uv pip install "huggingface_hub[torch] @ ."
              uv pip install --upgrade torch
              ;;

            "Python 3.10, torch_1.11")
              uv pip install "huggingface_hub[torch] @ ."
              uv pip install torch~=1.11
              ;;

          esac

          # hf_xet comes with `huggingface_hub[testing]`. Only the "transfer (no hf_xet)" job runs without it.
          if [[ "${{ matrix.test_name }}" == "transfer (no hf_xet)" ]]; then
            uv pip uninstall hf_xet
          fi

      # Run tests
      - name: Run tests
        working-directory: ./src # For code coverage to work
        run: |
          source ../.venv/bin/activate
          PYTEST="python -m pytest --cov=./huggingface_hub --cov-report=xml:../coverage.xml --vcr-record=none --reruns 3 --reruns-delay 2 --only-rerun '(OSError|FileNotFoundError|Timeout|HTTPError.*409|HTTPError.*502|HTTPError.*504)'"

          case "${{ matrix.test_name }}" in

            api | inference)
              eval "$PYTEST ../tests -m ${{ matrix.test_name }} -n 4"
            ;;

            "transfer (hf_xet)")
              eval "$PYTEST ../tests -m transfer -n 4"
            ;;

            "transfer (no hf_xet)")
              eval "$PYTEST ../tests -m 'transfer and not xet' -n 4"
            ;;

            gradio)
              eval "$PYTEST ../tests/test_webhooks_server.py"
            ;;

            "Python 3.10, torch_1.11" | torch_latest)
            eval "$PYTEST ../tests/test_hub_mixin*"
            eval "$PYTEST ../tests/test_serialization.py"
            ;;

          esac

      # Upload code coverage
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          verbose: true

  build-windows:
    permissions:
      contents: read
    # (almost) Duplicate config compared to `build-ubuntu` but running on Windows.
    # Please make sure to keep it updated as well.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DISABLE_SYMLINKS_IN_WINDOWS_TESTS: 1
      UV_HTTP_TIMEOUT: 600 # max 10min to install deps
      GIT_CLONE_PROTECTION_ACTIVE: false # See https://github.com/git-lfs/git-lfs/issues/5754
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        test_name: ["api", "transfer (hf_xet)", "transfer (no hf_xet)", "inference"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Setup venv
      # TODO: revisit when https://github.com/astral-sh/uv/issues/1526 is addressed.
      - name: Setup venv + uv
        run: |
          pip install --upgrade uv
          uv venv

      # Install dependencies
      - name: Install dependencies
        run: |
          uv pip install "huggingface_hub[testing] @ ."

          # hf_xet comes with `huggingface_hub[testing]`. Only the "transfer (no hf_xet)" job runs without it.
          if ("${{ matrix.test_name }}" -eq "transfer (no hf_xet)") {
            uv pip uninstall hf_xet
          }

      # Run tests
      - name: Run tests
        working-directory: ./src # For code coverage to work
        run: |
          ..\.venv\Scripts\activate
          $PYTEST_ARGS = @(
            "-m", "pytest",
            "-n", "4",
            "--cov=./huggingface_hub",
            "--cov-report=xml:../coverage.xml",
            "--vcr-record=none",
            "--reruns", "3",
            "--reruns-delay", "2",
            "--only-rerun", "(OSError|FileNotFoundError|Timeout|HTTPError.*409|HTTPError.*502|HTTPError.*504)",
            "../tests"
          )

          switch ("${{ matrix.test_name }}") {
            "api" { python $PYTEST_ARGS -m "api" }
            "transfer (hf_xet)" { python $PYTEST_ARGS -m "transfer" }
            "transfer (no hf_xet)" { python $PYTEST_ARGS -m "transfer and not xet" }
            "inference" { python $PYTEST_ARGS -m "inference" }
          }

      # Upload code coverage
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          verbose: true
