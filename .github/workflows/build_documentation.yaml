name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@06d4dc06c4e3f347dde2d716120f813db727a5da  # main
    with:
      commit_sha: ${{ github.sha }}
      package: huggingface_hub
      languages: cn de fr en hi ko or ta
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
