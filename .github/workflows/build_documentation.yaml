name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@9a495345d297ea11ab6f172524d7ee91a22a8baf  # main
    with:
      commit_sha: ${{ github.sha }}
      package: huggingface_hub
      languages: cn de fr en hi ko or mr ta 
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
