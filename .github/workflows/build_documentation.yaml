name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@911ed7872ad44fe0e1e6f03c232fbf4ab42c5957  # main
    with:
      commit_sha: ${{ github.sha }}
      package: huggingface_hub
      path_to_docs: huggingface_hub/docs/source/en/
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
