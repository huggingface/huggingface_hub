name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@8440c79a619b26fbf8444f42262757fbb8718617  # main
    with:
      commit_sha: ${{ github.sha }}
      package: huggingface_hub
      languages: cn de fr en hi ko or ta
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
