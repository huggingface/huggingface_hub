name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@0dfcf5df8e8a75af74f8a01ddb34dc3324aee291  # main
    with:
      commit_sha: ${{ github.sha }}
      package: huggingface_hub
      path_to_docs: huggingface_hub/docs/source/en/
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
