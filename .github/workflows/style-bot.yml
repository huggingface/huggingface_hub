name: Style Bot

# Summoned by a review rather than a plain comment. The review payload carries
# the commit it was submitted on, so the workflow never has to ask the API which
# commit to trust — and so cannot be handed a different one by a later push.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  style:
    uses: ./.github/workflows/style-bot-action.yml
    with:
      python_quality_dependencies: "[quality]"
      style_command_type: "style_only"
    secrets:
      app_id: ${{ secrets.HF_BOT_STYLE_APP_ID }}
      app_private_key: ${{ secrets.HF_BOT_STYLE_SECRET_PEM }}
