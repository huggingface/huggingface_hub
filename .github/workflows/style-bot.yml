name: Style Bot

# Comment `@bot /style <full commit SHA>` after reviewing that commit.
# issue_comment uses the trusted default-branch workflow and supports fork PRs.
# The SHA in the comment is the authorization; the API may only reject it.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  style:
    uses: ./.github/workflows/style-bot-action.yml
    with:
      python_quality_dependencies: "[quality]"
      style_command_type: "style_only"
    secrets:
      app_id: ${{ secrets.HF_BOT_STYLE_APP_ID }}
      app_private_key: ${{ secrets.HF_BOT_STYLE_SECRET_PEM }}
